services:
  mariadb:
    build: ./services/mariadb
    image: mariadb_img
    container_name: mariadb_cont
    networks:
      - inception_network
    volumes:
      - mariadb_vol:/var/lib/mysql
    restart: always
    env_file: .env
    secrets:
      - mdb_pass
      - mdb_root_pass

  wordpress:
    build: ./services/wordpress
    image: wordpress_img
    container_name: wordpress_cont
    depends_on:
      - mariadb
    networks:
      - inception_network
    volumes:
      - wordpress_vol:/var/www/html
    restart: always
    env_file: .env
    secrets:
      - mdb_pass
      - mdb_root_pass
      - wp_pass
      - wp_admin_pass
  
  nginx:
    build: ./services/nginx
    image: nginx_img
    container_name: nginx_cont
    ports:
      - 443:443
    depends_on:
      - wordpress
    networks:
      - inception_network
    volumes:
      - wordpress_vol:/var/www/html
    restart: always

networks:
  inception_network:
    driver: bridge

volumes:
  mariadb_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/rduro-pe/data/mariadb
  wordpress_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/rduro-pe/data/wordpress

secrets:
  mdb_pass:
    file: ./secrets/mdb_pass
  mdb_root_pass:
    file: ./secrets/mdb_root_pass
  wp_pass:
    file: ./secrets/wp_pass
  wp_admin_pass:
    file: ./secrets/wp_admin_pass
